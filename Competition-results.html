<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتائج المسابقة</title>

    <!-- رابط مكتبة Tailwind CSS عبر الـ CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- خط اختياري لجعل الخط العربي يبدو احترافياً (Cairo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Cairo', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50">

    <!-- سيكشن انتظار النتائج -->
    <div class="min-h-screen flex items-center justify-center p-4">
        <div
            class="max-w-md w-full bg-white rounded-2xl shadow-sm border border-gray-100 p-8 text-center transform transition-all hover:shadow-md">

            <!-- أيقونة الساعة / الانتظار -->
            <div
                class="w-20 h-20 bg-amber-50 rounded-full flex items-center justify-center mx-auto mb-6 text-amber-500 animate-pulse">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="w-10 h-10">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                </svg>
            </div>

            <!-- النصوص -->
            <h1 class="text-2xl font-bold text-gray-800 mb-3">
                نتائج المسابقة لم تظهر بعد
            </h1>

            <p class="text-gray-500 text-sm leading-relaxed mb-6">
                نحن نعمل حالياً على مراجعة كافة المشاركات بدقة وعناية. سيتم الإعلان عن النتائج الرسمية فور انتهاء لجنة
                التحكيم من التقييم.
            </p>

            <!-- شريط حالة توضيحي -->
            <div class="bg-gray-50 rounded-xl p-4 border border-gray-100 mb-6">
                <div class="flex items-center justify-between text-xs text-gray-400 mb-2">
                    <span>جاري التقييم</span>
                    <span>إعلان النتائج</span>
                </div>
                <div class="w-full bg-gray-200 h-2 rounded-full overflow-hidden">
                    <div class="bg-amber-500 h-full w-2/3 rounded-full"></div>
                </div>
            </div>

            <!-- زر لتحديث الصفحة -->
            <button onclick="window.location.reload();"
                class="inline-flex items-center justify-center px-6 py-2.5 bg-gray-900 hover:bg-gray-800 text-white font-medium text-sm rounded-lg transition-colors duration-200 w-full shadow-sm">
                تحديث الصفحة
            </button>

        </div>
    </div>

</body>

</html>
